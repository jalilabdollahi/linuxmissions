{
  "name": "Prune for Everyone",
  "description": "prune.sh was written in a hurry during the disk-full incident: it only works from one folder, always keeps 7, breaks on names with spaces and prints its chatter into the output that other scripts read. Now every team wants to run it from cron and from their own scripts. REQUEST.txt is the interface they agreed on.",
  "objective": "Rewrite prune.sh to the interface in REQUEST.txt: `prune.sh [OPTIONS] [DIR]` deletes the *.tar.gz files directly in DIR except the N most recently modified; -k/--keep N (also --keep=N), -n/--dry-run, -h/--help, and -- are supported; settings come from defaults, then the config file ($PRUNE_CONFIG or ~/.config/prune.conf), then PRUNE_KEEP/PRUNE_DIR, then the command line, each overriding the one before. stdout holds only the deleted (or would-be-deleted) names, oldest first; everything else goes to stderr. Exit 0 when done, 1 when DIR does not exist, 2 on a usage error. A second run deletes nothing. It is tested with about 20 command lines on folders you have not seen.",
