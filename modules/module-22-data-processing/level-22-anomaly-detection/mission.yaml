  "objective": "Write an executable detect.sh that is run as ./detect.sh FILE and prints CSV to stdout: the header host,date,value,zscore, then one line per anomaly, sorted by host and then date. A value is an anomaly when it is more than 3 standard deviations above or below the mean of its own host, using the population standard deviation (divide by n) over that host's numeric values only. Values that are not numbers are left out of everything; a host whose values never change has no anomalies. value is copied as written, zscore = (value - mean) / sd with 2 decimals. Save its output for requests.csv as anomalies.csv. detect.sh will also be run on another file.",
