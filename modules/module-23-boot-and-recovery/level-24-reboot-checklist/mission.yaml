{
  "name": "Pre-Reboot Checklist",
  "description": "Before tonight's reboot window the team wants a script that tells, from a mounted root filesystem and without rebooting, whether the machine will come back. roots/healthy and roots/broken are two captured roots to test with: each has boot/grub/grub.cfg, boot/, etc/fstab, blkid.txt (captured blkid), df.txt (captured df -BM /boot) and etc/systemd/system/default.target.",
